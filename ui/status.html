<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>git</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --error: #d70015; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --error: #ff453a; } }
    :root[data-theme="dark"] { --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --error: #ff453a; }
    body { margin: 0; padding: 12px 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    p { margin: 0 0 8px; overflow-wrap: anywhere; }
    code { font: 12px ui-monospace, monospace; }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
    #message { color: var(--muted); }
    #message.error { color: var(--error); }
    .buttons { display: flex; gap: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p id="message">git 상태를 확인하는 중이에요.</p>
  <div class="buttons">
    <button id="install" type="button" hidden>설치</button>
    <button id="init" type="button" hidden>git init</button>
    <button id="check" type="button" hidden>다시 확인</button>
  </div>
  <script type="module" src="status.js"></script>
</body>
</html>
